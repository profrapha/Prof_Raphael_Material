<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pedagógico - Prof. Raphael Paulino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --bg-card: #182238;
            --border-card: #23324d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-blue-hover: #0ea5e9;
            --accent-emerald: #10b981;
            --accent-emerald-hover: #059669;
            --accent-amber: #f59e0b;
            --accent-violet: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            background-color: rgba(19, 27, 46, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            color: var(--text-main);
            cursor: pointer;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-status-prof {
            background-color: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border-card);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-status-prof.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* Breadcrumb Bar */
        .breadcrumb-bar {
            max-width: 1200px;
            margin: 1.25rem auto 0;
            padding: 0 1.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .breadcrumb-item {
            cursor: pointer;
            transition: color 0.2s;
        }

        .breadcrumb-item:hover {
            color: var(--accent-blue);
        }

        .breadcrumb-item.active {
            color: var(--text-main);
            font-weight: 600;
            cursor: default;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 1.5rem auto 3rem;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Titles and Subtitles */
        .view-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .view-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .view-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Generic Grids */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .interactive-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .interactive-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .interactive-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .card-footer-link {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Year Selector Grid */
        .years-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .year-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .year-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .year-card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .year-card span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Units Grid */
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .unit-summary-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .unit-summary-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-3px);
        }

        .unit-number-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            margin-bottom: 0.75rem;
        }

        .unit-summary-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .unit-summary-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        /* Material Details (Autoral vs Escola) */
        .material-group {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .material-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .badge-tipo {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-tipo.autoral {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
        }

        .badge-tipo.escola {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        .material-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }

        .btn-pdf {
            flex: 1;
            min-width: 140px;
            background-color: var(--accent-blue);
            color: #0b0f19;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border: none;
            cursor: pointer;
        }

        .btn-pdf:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-prof {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .btn-prof:hover {
            background-color: rgba(16, 185, 129, 0.25);
        }

        /* Videos */
        .video-card-item {
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }

        .video-card-item:hover {
            background-color: rgba(56, 189, 248, 0.08);
            border-color: var(--accent-blue);
        }

        .video-duvida {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 500;
        }

        .video-titulo {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
            margin: 0.2rem 0;
        }

        .video-autor {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Modais */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-video-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .modal-video-header {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .video-iframe-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
        }

        .modal-box h3 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }

        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .modal-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        .btn-confirm {
            background-color: var(--accent-emerald);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-card);
            background-color: var(--bg-secondary);
        }
    </style>
</head>

        </div>
    </div>

            <input type="password" id="inputChave" placeholder="Digite a chave mestra..." onkeydown="if(event.key==='Enter') confirmarChave()">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarChave()">Desbloquear</button>
            </div>
        </div>
    </div>

        };

        function iniciar() {
            renderizar();
            atualizarBotaoProf();
        }

        function irNivel(novoNivel, params = {}) {
            nav.nivel = novoNivel;
            if (params.materia !== undefined) nav.materia = params.materia;
            if (params.frente !== undefined) nav.frente = params.frente;
            if (params.ano !== undefined) nav.ano = params.ano;
            if (params.unidadeId !== undefined) nav.unidadeId = params.unidadeId;

            if (novoNivel === 'home') {
                nav.materia = null;
                nav.frente = null;
                nav.ano = null;
                nav.unidadeId = null;
            }
            renderizar();
        }

        function renderBreadcrumb() {
            const bar = document.getElementById("breadcrumbBar");
            if (nav.nivel === 'home') {
                bar.innerHTML = "";
                return;
            }

            let crumbs = `<span class="breadcrumb-item" onclick="irNivel('home')">🏠 Início</span>`;

            if (nav.materia) {
                const labelMateria = nav.frente ? `${catalogo[nav.materia].nome}: ${catalogo[nav.materia].frentes[nav.frente].nome}` : catalogo[nav.materia].nome;
                crumbs += ` <span>&rsaquo;</span> <span class="breadcrumb-item ${nav.nivel === 'anos' ? 'active' : ''}" onclick="irNivel('anos')">${labelMateria}</span>`;
            }

            if (nav.ano) {
                let anoNome = "";
                if (nav.materia === "Fisica") {
                    anoNome = catalogo.Fisica.anos[nav.ano].nome;
                } else {
                    anoNome = catalogo.Matematica.frentes[nav.frente].anos[nav.ano].nome;
                }
                crumbs += ` <span>&rsaquo;</span> <span class="breadcrumb-item ${nav.nivel === 'unidades' ? 'active' : ''}" onclick="irNivel('unidades')">${anoNome}</span>`;
            }

            if (nav.unidadeId) {
                crumbs += ` <span>&rsaquo;</span> <span class="breadcrumb-item active">${nav.unidadeId}</span>`;
            }

            bar.innerHTML = crumbs;
        }

        function renderizar() {
            renderBreadcrumb();
            const container = document.getElementById("mainContainer");

            switch (nav.nivel) {
                case 'home':
                    renderHome(container);
                    break;
                case 'frentes':
                    renderFrentes(container);
                    break;
                case 'anos':
                    renderAnos(container);
                    break;
                case 'unidades':
                    renderUnidades(container);
                    break;
                case 'detalhe_unidade':
                    renderDetalheUnidade(container);
                    break;
            }
        }

                                <h3>Física</h3>
                            </div>
                            <p>Camadas terrestres, astronomia, máquinas simples, conservação da energia mecânica, óptica e dinâmica newtoniana.</p>
                        </div>
                        <div class="card-footer-link">Escolher Série &rarr;</div>
                    </div>
                </div>
            `;
        }

        // 3. ANOS: Escolha da Série/Ano Escolar
        function renderAnos(container) {
            let anosDisponiveis = {};
            let nomeFrente = "";

            if (nav.materia === "Fisica") {
                anosDisponiveis = catalogo.Fisica.anos;
                nomeFrente = "Física";
            } else {
                anosDisponiveis = catalogo.Matematica.frentes[nav.frente].anos;
                nomeFrente = catalogo.Matematica.frentes[nav.frente].nome;
            }

            let cardsHtml = `
                <div class="view-header">
                    <h2>${nomeFrente} - Selecione o Ano</h2>
                    <p>Selecione a sua turma para visualizar o cronograma de unidades:</p>
                </div>
                <div class="years-grid">
            `;

            for (const chave in anosDisponiveis) {
                cardsHtml += `
                    <div class="year-card" onclick="irNivel('unidades', { ano: '${chave}' })">
                        <h3>${anosDisponiveis[chave].nome}</h3>
                        <span>Ver unidades &rarr;</span>
                    </div>
                `;
            }

            cardsHtml += `</div>`;
            container.innerHTML = cardsHtml;
        }

        // 4. UNIDADES: Exibe apenas os cards das Unidades (ex: UNIDADE 6)
        function renderUnidades(container) {
            let unidadesDisponiveis = {};
            let anoNome = "";

            if (nav.materia === "Fisica") {
                anoNome = catalogo.Fisica.anos[nav.ano].nome;
                unidadesDisponiveis = catalogo.Fisica.anos[nav.ano].unidades;
            } else {
                anoNome = catalogo.Matematica.frentes[nav.frente].anos[nav.ano].nome;
                unidadesDisponiveis = catalogo.Matematica.frentes[nav.frente].anos[nav.ano].unidades;
            }

            let cardsHtml = `
                <div class="view-header">
                    <h2>${anoNome} - Unidades Disponíveis</h2>
                    <p>Selecione a unidade temática para acessar as opções de materiais e videoaulas:</p>
                </div>
                <div class="units-grid">
            `;

            for (const idUni in unidadesDisponiveis) {
                const uni = unidadesDisponiveis[idUni];
                const qtdMateriais = uni.materiais.length;

                cardsHtml += `
                    <div class="unit-summary-card" onclick="irNivel('detalhe_unidade', { unidadeId: '${idUni}' })">
                        <div>
                            <span class="unit-number-badge">${idUni}</span>
                            <h3>${uni.titulo}</h3>
                            <p>${uni.desc}</p>
                        </div>
                        <div class="card-footer-link">${qtdMateriais} caderno(s) disponível(is) &rarr;</div>
                    </div>
                `;
            }

            cardsHtml += `</div>`;
            container.innerHTML = cardsHtml;
        }

        // 5. DETALHE DA UNIDADE: Escolha entre Autoral e Escola + Vídeos
        function renderDetalheUnidade(container) {
            let uni = null;
            if (nav.materia === "Fisica") {
                uni = catalogo.Fisica.anos[nav.ano].unidades[nav.unidadeId];
            } else {
                uni = catalogo.Matematica.frentes[nav.frente].anos[nav.ano].unidades[nav.unidadeId];
            }

            let html = `
                <div class="view-header">
                    <h2>${nav.unidadeId}: ${uni.titulo}</h2>
                    <p>${uni.desc}</p>
                </div>
            `;

            uni.materiais.forEach(mat => {
                const isAutoral = mat.tipo === "Autoral";

                let videosHtml = "";
                if (mat.videos && mat.videos.length > 0) {
                    videosHtml = `
                        <div style="margin-top: 1.25rem;">
                            <span style="font-size: 0.8rem; color: var(--accent-blue); font-weight: 600;">▶ Videoaulas Recomendadas (${mat.videos.length}):</span>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                                ${mat.videos.map(v => `
                                    <div class="video-card-item" onclick="abrirModalVideo('${v.url}', '${v.titulo}')">
                                        <div class="video-duvida">💡 ${v.duvida}</div>
                                        <div class="video-titulo">📺 ${v.titulo}</div>
                                        <div class="video-autor">${v.autor}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                let btnProfHtml = "";
                if (mat.pdfProf) {
                    btnProfHtml = `
                        <button class="btn-prof" onclick="acessarGabarito('${mat.pdfProf}')">
                            🔒 Gabarito
                        </button>
                    `;
                }

                html += `
                    <div class="material-group">
                        <div class="material-header">
                            <span class="badge-tipo ${isAutoral ? 'autoral' : 'escola'}">${mat.rotulo}</span>
                        </div>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">
                            ${isAutoral ? 'Caderno autoral com teoria contextualizada, exercícios estruturados por habilidades e foco em aprofundamento.' : 'Exercícios adaptados e organizados a partir da apostila adotada pela escola.'}
                        </p>

                        <div class="material-actions">
                            <a href="${mat.pdf}" target="_blank" class="btn-pdf">
                                📄 Lista do Aluno (PDF)
                            </a>
                            ${btnProfHtml}
                        </div>

                        ${videosHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // PLAYER MODAL DE VIDEOAULA
        // ==========================================
        function abrirModalVideo(url, titulo) {
            document.getElementById("videoModalTitulo").innerText = titulo;
            document.getElementById("videoIframe").src = url;
            document.getElementById("modalVideo").classList.add("open");
        }

        function fecharModalVideo() {
            document.getElementById("modalVideo").classList.remove("open");
            document.getElementById("videoIframe").src = "";
        }

        // ==========================================
        // MOTOR DE GABARITO TEMPORÁRIO (SECURE LINK)
        // ==========================================
        let urlGabaritoPendente = null;

        function abrirModalChave(url = null) {
            urlGabaritoPendente = url;
            document.getElementById("modalChave").classList.add("open");
            document.getElementById("inputChave").focus();
        }

        function fecharModal() {
            document.getElementById("modalChave").classList.remove("open");
            document.getElementById("inputChave").value = "";
            urlGabaritoPendente = null;
        }

        function confirmarChave() {
            const chave = document.getElementById("inputChave").value.trim();
            if (!chave) return;

            sessionStorage.setItem("prof_secret_key", chave);
            fecharModal();
            atualizarBotaoProf();

            if (urlGabaritoPendente) {
                gerarLinkEAbrir(urlGabaritoPendente, chave);
            }
        }

        function atualizarBotaoProf() {
            const btn = document.getElementById("btnProfToggle");
            if (sessionStorage.getItem("prof_secret_key")) {
                btn.className = "btn-status-prof active";
                btn.innerHTML = "🔓 Professor Ativo (Sair)";
                btn.onclick = () => {
                    sessionStorage.removeItem("prof_secret_key");
                    atualizarBotaoProf();
                };
            } else {
                btn.className = "btn-status-prof";
                btn.innerHTML = "🔒 Modo Professor";
                btn.onclick = () => abrirModalChave();
            }
        }

        function acessarGabarito(caminhoPdf) {
            const chaveSalva = sessionStorage.getItem("prof_secret_key");
            if (!chaveSalva) {
                abrirModalChave(caminhoPdf);
            } else {
                gerarLinkEAbrir(caminhoPdf, chaveSalva);
            }
        }

        function gerarLinkEAbrir(caminhoRelativo, chaveMestra) {
            const agoraUnix = Math.floor(Date.now() / 1000);
            const expiraEm = agoraUnix + 180; // 3 minutos

            const uri = caminhoRelativo.startsWith('/') ? caminhoRelativo : '/' + caminhoRelativo;
            const stringParaAssinar = `${expiraEm}${uri} ${chaveMestra}`;

            const hash = CryptoJS.MD5(stringParaAssinar);
            let base64Hash = CryptoJS.enc.Base64.stringify(hash)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');

            const urlFinal = `${uri}?st=${base64Hash}&e=${expiraEm}`;
            window.open(urlFinal, '_blank');
        }

        iniciar();
    </script>
</body>
</html>
