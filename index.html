<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Materiais - Prof. Raphael Paulino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --bg-card: #182238;
            --border-card: #23324d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-blue-hover: #0ea5e9;
            --accent-emerald: #10b981;
            --accent-emerald-hover: #059669;
            --accent-amber: #f59e0b;
            --accent-violet: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        header {
            background-color: rgba(19, 27, 46, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            color: var(--text-main);
            cursor: pointer;
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-status-prof {
            background-color: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border-card);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-status-prof.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* Nav Filter Container */
        .nav-container {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
            width: 100%;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            background-color: var(--bg-secondary);
            padding: 0.6rem 0.9rem;
            border-radius: 12px;
            border: 1px solid var(--border-card);
        }

        .nav-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background-color: var(--accent-blue);
            color: #0b0f19;
            font-weight: 600;
        }

        .nav-btn.home-btn {
            border: 1px solid var(--border-card);
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 1.5rem auto 3rem;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Home View Styles */
        .home-hero {
            text-align: center;
            padding: 3rem 1rem 2.5rem;
        }

        .home-hero h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-hero p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .home-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .home-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .home-card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .home-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .home-card h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .home-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .home-card-link {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Catalog Grid Styles */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .unit-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .unit-card:hover {
            border-color: #3b5074;
            transform: translateY(-2px);
        }

        .card-header {
            padding: 1.25rem 1.25rem 0.75rem;
        }

        .unit-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .unit-badge.adaptado {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .card-body {
            padding: 0 1.25rem 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-pdf {
            flex: 1;
            min-width: 140px;
            background-color: var(--accent-blue);
            color: #0b0f19;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-pdf:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-prof {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-prof:hover {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: #10b981;
        }

        /* Pedagogical Videos Accordion */
        .videos-section {
            margin-top: 1.25rem;
            border-top: 1px solid var(--border-card);
            padding-top: 0.75rem;
        }

        details {
            margin-bottom: 0.25rem;
        }

        summary {
            font-size: 0.85rem;
            color: var(--accent-blue);
            cursor: pointer;
            user-select: none;
            padding: 0.4rem 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        summary:hover {
            color: var(--accent-blue-hover);
        }

        .video-list {
            list-style: none;
            margin-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .video-card-item {
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .video-card-item:hover {
            background-color: rgba(56, 189, 248, 0.08);
            border-color: var(--accent-blue);
        }

        .video-duvida {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .video-titulo {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.35;
        }

        .video-autor {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Modal Player de Video */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-video-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-video-header {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
        }

        .modal-video-header h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
            line-height: 1;
        }

        .btn-close-modal:hover {
            color: var(--text-main);
        }

        .video-iframe-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }

        .video-iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Modal Chave Professor */
        .modal-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-box h3 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }

        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        .modal-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: var(--accent-blue);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        .btn-confirm {
            background-color: var(--accent-emerald);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 0.55rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-card);
            background-color: var(--bg-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="irParaHome()">
            <div class="brand-icon">RP</div>
            <div class="brand-title">
                <h1>Prof. Raphael Paulino</h1>
                <p>Repositório de Estudos e Materiais Didáticos</p>
            </div>
        </div>

        <div class="header-actions">
            <button id="btnProfToggle" class="btn-status-prof" onclick="abrirModalChave()">
                🔒 Modo Professor
            </button>
        </div>
    </header>

    <div class="nav-container" id="navContainer" style="display: none;">
        <div class="filter-bar" id="filtroMateria"></div>
        <div class="filter-bar" style="margin-top: 0.5rem;" id="filtroAno"></div>
    </div>

    <main id="mainContent">
        <!-- Renderizado dinamicamente: Home ou Cards da Unidade -->
    </main>

    <footer>
        <p>Desenvolvido para apoio escolar e preparação acadêmica &bull; Atualizado automaticamente</p>
    </footer>

    <!-- Modal para Player de Videoaula -->
    <div class="modal-overlay" id="modalVideo">
        <div class="modal-video-box">
            <div class="modal-video-header">
                <h4 id="videoModalTitulo">Videoaula</h4>
                <button class="btn-close-modal" onclick="fecharModalVideo()">&times;</button>
            </div>
            <div class="video-iframe-container">
                <iframe id="videoIframe" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
        </div>
    </div>

    <!-- Modal para Chave do Professor -->
    <div class="modal-overlay" id="modalChave">
        <div class="modal-box">
            <h3>Área do Professor</h3>
            <p>Digite a chave mestra configurada no servidor para liberar os links com autodestruição:</p>
            <input type="password" id="inputChave" placeholder="Digite a chave mestra..." onkeydown="if(event.key==='Enter') confirmarChave()">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarChave()">Desbloquear</button>
            </div>
        </div>
    </div>

        // Estado Global (Inicia na Home)
        let estado = {
            materia: null,
            frente: null,
            ano: null
        };

        function iniciar() {
            renderizar();
            atualizarBotaoProf();
        }

        function irParaHome() {
            estado.materia = null;
            estado.frente = null;
            estado.ano = null;
            renderizar();
        }

        function selecionarMateria(materia, frente = null) {
            estado.materia = materia;
            estado.frente = frente;
            // Define o ano padrão dependendo da seleção
            if (materia === "Fisica") {
                estado.ano = "6_Ano";
            } else {
                estado.ano = "9_Ano";
            }
            renderizar();
        }

        function renderizar() {
            const nav = document.getElementById("navContainer");
            const main = document.getElementById("mainContent");

            if (!estado.materia) {
                // Renderiza Tela Home
                nav.style.display = "none";
                renderHome(main);
            } else {
                // Renderiza Catálogo
                nav.style.display = "block";
                renderFiltros();
                renderCards(main);
            }
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="home-hero">
                    <h2>Portal de Materiais Didáticos</h2>
                    <p>Cadernos de apoio pedagógico, listas de exercícios estruturadas por habilidades e curadoria de videoaulas para fundamentação teórica.</p>
                </div>

                <div class="home-grid">
                    <div class="home-card" onclick="selecionarMateria('Matematica', 'Algebra')">
                        <div>
                            <div class="home-card-header">
                                <div class="home-card-icon" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;">📐</div>
                                <h3>Álgebra</h3>
                            </div>
                            <p>Do 6º Ano ao Ensino Médio: frações, equações quadráticas, funções, inequações, polinômios e intensivos para vestibulares.</p>
                        </div>
                        <div class="home-card-link">Acessar Cadernos de Álgebra &rarr;</div>
                    </div>

                    <div class="home-card" onclick="selecionarMateria('Matematica', 'Geometria')">
                        <div>
                            <div class="home-card-header">
                                <div class="home-card-icon" style="background: rgba(168, 85, 247, 0.15); color: #a855f7;">📏</div>
                                <h3>Geometria</h3>
                            </div>
                            <p>Cálculo de áreas e perímetros, polígonos regulares, geometria espacial, projeção ortogonal e corpos redondos.</p>
                        </div>
                        <div class="home-card-link">Acessar Cadernos de Geometria &rarr;</div>
                    </div>

                    <div class="home-card" onclick="selecionarMateria('Fisica')">
                        <div>
                            <div class="home-card-header">
                                <div class="home-card-icon" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">⚡</div>
                                <h3>Física</h3>
                            </div>
                            <p>Estrutura da Terra, mecânica, máquinas simples, astronomia fundamental, óptica geométrica e dinâmica curvilínea.</p>
                        </div>
                        <div class="home-card-link">Acessar Cadernos de Física &rarr;</div>
                    </div>
                </div>
            `;
        }

        function renderFiltros() {
            const containerMateria = document.getElementById("filtroMateria");
            const containerAno = document.getElementById("filtroAno");
            containerMateria.innerHTML = "";
            containerAno.innerHTML = "";

            // Botão Voltar para Home
            const btnHome = document.createElement("button");
            btnHome.className = "nav-btn home-btn";
            btnHome.innerHTML = "🏠 Início";
            btnHome.onclick = () => irParaHome();
            containerMateria.appendChild(btnHome);

            // Botão Física
            const btnFisica = document.createElement("button");
            btnFisica.className = `nav-btn ${estado.materia === 'Fisica' ? 'active' : ''}`;
            btnFisica.innerText = "Física";
            btnFisica.onclick = () => {
                estado.materia = "Fisica";
                estado.frente = null;
                estado.ano = "6_Ano";
                renderizar();
            };
            containerMateria.appendChild(btnFisica);

            // Botão Matemática: Álgebra
            const btnAlg = document.createElement("button");
            btnAlg.className = `nav-btn ${estado.materia === 'Matematica' && estado.frente === 'Algebra' ? 'active' : ''}`;
            btnAlg.innerText = "Matemática: Álgebra";
            btnAlg.onclick = () => {
                estado.materia = "Matematica";
                estado.frente = "Algebra";
                estado.ano = "9_Ano";
                renderizar();
            };
            containerMateria.appendChild(btnAlg);

            // Botão Matemática: Geometria
            const btnGeo = document.createElement("button");
            btnGeo.className = `nav-btn ${estado.materia === 'Matematica' && estado.frente === 'Geometria' ? 'active' : ''}`;
            btnGeo.innerText = "Matemática: Geometria";
            btnGeo.onclick = () => {
                estado.materia = "Matematica";
                estado.frente = "Geometria";
                estado.ano = "9_Ano";
                renderizar();
            };
            containerMateria.appendChild(btnGeo);

            // Anos Disponíveis
            let anosDisponiveis = {};
            if (estado.materia === "Fisica") {
                anosDisponiveis = bancoDados.Fisica.anos;
            } else {
                anosDisponiveis = bancoDados.Matematica.frentes[estado.frente].anos;
            }

            for (const chave in anosDisponiveis) {
                const btn = document.createElement("button");
                btn.className = `nav-btn ${estado.ano === chave ? 'active' : ''}`;
                btn.innerText = anosDisponiveis[chave].nome;
                btn.onclick = () => {
                    estado.ano = chave;
                    renderizar();
                };
                containerAno.appendChild(btn);
            }
        }

        function renderCards(container) {
            let unidades = [];
            if (estado.materia === "Fisica") {
                unidades = bancoDados.Fisica.anos[estado.ano]?.unidades || [];
            } else {
                unidades = bancoDados.Matematica.frentes[estado.frente]?.anos[estado.ano]?.unidades || [];
            }

            let cardsHtml = '<div class="cards-grid">';

            unidades.forEach(unidade => {
                const isEscola = unidade.id.includes("Escola");

                let videosHtml = "";
                if (unidade.videos && unidade.videos.length > 0) {
                    videosHtml = `
                        <div class="videos-section">
                            <details>
                                <summary>
                                    <span>▶ Videoaulas Recomendadas (${unidade.videos.length})</span>
                                </summary>
                                <ul class="video-list">
                                    ${unidade.videos.map(v => `
                                        <li class="video-card-item" onclick="abrirModalVideo('${v.url}', '${v.titulo}')">
                                            <div class="video-duvida">💡 ${v.duvida}</div>
                                            <div class="video-titulo">📺 ${v.titulo}</div>
                                            <div class="video-autor">${v.autor}</div>
                                        </li>
                                    `).join('')}
                                </ul>
                            </details>
                        </div>
                    `;
                }

                let btnProfHtml = "";
                if (unidade.pdfProf) {
                    btnProfHtml = `
                        <button class="btn-prof" onclick="acessarGabarito('${unidade.pdfProf}')">
                            🔒 Gabarito
                        </button>
                    `;
                }

                cardsHtml += `
                    <div class="unit-card">
                        <div class="card-header">
                            <span class="unit-badge ${isEscola ? 'adaptado' : ''}">${unidade.id}</span>
                            <h2>${unidade.titulo}</h2>
                        </div>
                        <div class="card-body">
                            <p class="card-desc">${unidade.desc}</p>
                            
                            <div class="card-actions">
                                <a href="${unidade.pdf}" target="_blank" class="btn-pdf">
                                    📄 Lista do Aluno
                                </a>
                                ${btnProfHtml}
                            </div>

                            ${videosHtml}
                        </div>
                    </div>
                `;
            });

            cardsHtml += '</div>';
            container.innerHTML = cardsHtml;
        }

        // ==========================================
        // PLAYER MODAL DE VIDEOAULA
        // ==========================================
        function abrirModalVideo(url, titulo) {
            document.getElementById("videoModalTitulo").innerText = titulo;
            document.getElementById("videoIframe").src = url;
            document.getElementById("modalVideo").classList.add("open");
        }

        function fecharModalVideo() {
            document.getElementById("modalVideo").classList.remove("open");
            document.getElementById("videoIframe").src = "";
        }

        // ==========================================
        // MOTOR DE GABARITO TEMPORÁRIO (SECURE LINK)
        // ==========================================
        let urlGabaritoPendente = null;

        function abrirModalChave(url = null) {
            urlGabaritoPendente = url;
            document.getElementById("modalChave").classList.add("open");
            document.getElementById("inputChave").focus();
        }

        function fecharModal() {
            document.getElementById("modalChave").classList.remove("open");
            document.getElementById("inputChave").value = "";
            urlGabaritoPendente = null;
        }

        function confirmarChave() {
            const chave = document.getElementById("inputChave").value.trim();
            if (!chave) return;

            sessionStorage.setItem("prof_secret_key", chave);
            fecharModal();
            atualizarBotaoProf();

            if (urlGabaritoPendente) {
                gerarLinkEAbrir(urlGabaritoPendente, chave);
            }
        }

        function atualizarBotaoProf() {
            const btn = document.getElementById("btnProfToggle");
            if (sessionStorage.getItem("prof_secret_key")) {
                btn.className = "btn-status-prof active";
                btn.innerHTML = "🔓 Professor Ativo (Sair)";
                btn.onclick = () => {
                    sessionStorage.removeItem("prof_secret_key");
                    atualizarBotaoProf();
                };
            } else {
                btn.className = "btn-status-prof";
                btn.innerHTML = "🔒 Modo Professor";
                btn.onclick = () => abrirModalChave();
            }
        }

        function acessarGabarito(caminhoPdf) {
            const chaveSalva = sessionStorage.getItem("prof_secret_key");
            if (!chaveSalva) {
                abrirModalChave(caminhoPdf);
            } else {
                gerarLinkEAbrir(caminhoPdf, chaveSalva);
            }
        }

        function gerarLinkEAbrir(caminhoRelativo, chaveMestra) {
            // Validade de 3 minutos (180 segundos)
            const agoraUnix = Math.floor(Date.now() / 1000);
            const expiraEm = agoraUnix + 180;

            const uri = caminhoRelativo.startsWith('/') ? caminhoRelativo : '/' + caminhoRelativo;

            // Assinatura validada pelo Nginx
            const stringParaAssinar = `${expiraEm}${uri} ${chaveMestra}`;

            // MD5 Base64 URL-Safe sem padding
            const hash = CryptoJS.MD5(stringParaAssinar);
            let base64Hash = CryptoJS.enc.Base64.stringify(hash)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');

            const urlFinal = `${uri}?st=${base64Hash}&e=${expiraEm}`;
            window.open(urlFinal, '_blank');
        }

        // Inicia na Home
        iniciar();
    </script>
