    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --border-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-blue-hover: #0ea5e9;
            --accent-emerald: #10b981;
            --accent-emerald-hover: #059669;
            --accent-amber: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon {
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-status-prof {
            background-color: #334155;
            color: var(--text-muted);
            border: 1px solid #475569;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-status-prof.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* Breadcrumb / Navigation Bar */
        .nav-container {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
            width: 100%;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            background-color: var(--bg-secondary);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-card);
        }

        .nav-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
        }

        /* Main Catalog Content */
        main {
            max-width: 1200px;
            margin: 1.5rem auto 3rem;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .unit-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .unit-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        .card-header {
            padding: 1.25rem 1.25rem 0.75rem;
        }

        .unit-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .unit-badge.adaptado {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .card-body {
            padding: 0 1.25rem 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-pdf {
            flex: 1;
            min-width: 140px;
            background-color: var(--accent-blue);
            color: #0f172a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-pdf:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-prof {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-prof:hover {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: #10b981;
        }

        /* Section of Videos Accordion */
        .videos-section {
            margin-top: 1rem;
            border-top: 1px solid #334155;
            padding-top: 0.75rem;
        }

        details {
            margin-bottom: 0.5rem;
        }

        summary {
            font-size: 0.8rem;
            color: var(--accent-blue);
            cursor: pointer;
            user-select: none;
            padding: 0.25rem 0;
            font-weight: 500;
        }

        summary:hover {
            text-decoration: underline;
        }

        .video-list {
            list-style: none;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .video-item a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            display: block;
            padding: 0.35rem 0.5rem;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.02);
            transition: all 0.2s;
        }

        .video-item a:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.06);
        }

        /* Modal Key Prompt */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-box h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .modal-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .modal-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: var(--accent-blue);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        .btn-confirm {
            background-color: var(--accent-emerald);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-card);
            background-color: var(--bg-secondary);
        }
    </style>
</head>

                                { id: "UNIDADE 6", titulo: "Área e Perímetro", desc: "Perímetro de contorno e cálculo de superfícies diversas.", pdf: "Matematica_Geometria/7_Ano/UNIDADE6/publica/GEO_7EF_AUT_U06-AREA_PERIMETRO_ALUNO.pdf", pdfProf: null, videos: [] }
                            ]},
                            "8_Ano": { nome: "8º Ano", unidades: [
                                { id: "UNIDADE 6", titulo: "Áreas Planas e Decomposição", desc: "Cálculo por composição e decomposição de figuras.", pdf: "Matematica_Geometria/8_Ano/UNIDADE6/publica/GEO_8EF_AUT_U06-FIGURAS_PLANAS_ALUNO.pdf", pdfProf: null, videos: [] }
                            ]},
                            "9_Ano": { nome: "9º Ano", unidades: [
                                { id: "UNIDADE 6", titulo: "Geometria Espacial e Vistas", desc: "Poliedros, Relação de Euler e Projeção Ortogonal.", pdf: "Matematica_Geometria/9_Ano/UNIDADE6/publica/GEO_9EF_AUT_U06-GEOM_ESPACIAL_ALUNO.pdf", pdfProf: null, videos: [] }
                            ]},
                            "1_Serie": { nome: "1ª Série (EM)", unidades: [
                                { id: "UNIDADE 6", titulo: "Polígonos e Círculos", desc: "Apótemas, setores circulares e coroas circulares.", pdf: "Matematica_Geometria/1_Serie/UNIDADE6/publica/GEO_1EM_AUT_U06-FIGURAS_PLANAS_ALUNO.pdf", pdfProf: null, videos: [] }
                            ]},
                            "2_Serie": { nome: "2ª Série (EM)", unidades: [
                                { id: "UNIDADE 6", titulo: "Cones e Troncos", desc: "Áreas totais, volumes e seções cônicas.", pdf: "Matematica_Geometria/2_Serie/UNIDADE6/publica/GEO_2EM_AUT_U06-CONES_ALUNO.pdf", pdfProf: null, videos: [] }
                            ]}
                        }
                    }
                }
            }
        };

        // Estado da Seleção Atual
        let estado = {
            materia: "Matematica",
            frente: "Algebra",
            ano: "9_Ano"
        };

        function iniciar() {
            renderFiltroMateria();
            renderFiltroAno();
            renderCards();
            atualizarBotaoProf();
        }

        function renderFiltroMateria() {
            const container = document.getElementById("filtroMateria");
            container.innerHTML = "";

            // Botão Física
            const btnFisica = document.createElement("button");
            btnFisica.className = `nav-btn ${estado.materia === 'Fisica' ? 'active' : ''}`;
            btnFisica.innerText = "Física";
            btnFisica.onclick = () => {
                estado.materia = "Fisica";
                estado.frente = null;
                estado.ano = "9_Ano";
                renderFiltroMateria();
                renderFiltroAno();
                renderCards();
            };
            container.appendChild(btnFisica);

            // Botão Matemática - Álgebra
            const btnAlg = document.createElement("button");
            btnAlg.className = `nav-btn ${estado.materia === 'Matematica' && estado.frente === 'Algebra' ? 'active' : ''}`;
            btnAlg.innerText = "Matemática: Álgebra";
            btnAlg.onclick = () => {
                estado.materia = "Matematica";
                estado.frente = "Algebra";
                estado.ano = "9_Ano";
                renderFiltroMateria();
                renderFiltroAno();
                renderCards();
            };
            container.appendChild(btnAlg);

            // Botão Matemática - Geometria
            const btnGeo = document.createElement("button");
            btnGeo.className = `nav-btn ${estado.materia === 'Matematica' && estado.frente === 'Geometria' ? 'active' : ''}`;
            btnGeo.innerText = "Matemática: Geometria";
            btnGeo.onclick = () => {
                estado.materia = "Matematica";
                estado.frente = "Geometria";
                estado.ano = "9_Ano";
                renderFiltroMateria();
                renderFiltroAno();
                renderCards();
            };
            container.appendChild(btnGeo);
        }

        function renderFiltroAno() {
            const container = document.getElementById("filtroAno");
            container.innerHTML = "";

            let anosDisponiveis = {};
            if (estado.materia === "Fisica") {
                anosDisponiveis = bancoDados.Fisica.anos;
            } else {
                anosDisponiveis = bancoDados.Matematica.frentes[estado.frente].anos;
            }

            for (const chave in anosDisponiveis) {
                const btn = document.createElement("button");
                btn.className = `nav-btn ${estado.ano === chave ? 'active' : ''}`;
                btn.innerText = anosDisponiveis[chave].nome;
                btn.onclick = () => {
                    estado.ano = chave;
                    renderFiltroAno();
                    renderCards();
                };
                container.appendChild(btn);
            }
        }

        function renderCards() {
            const grid = document.getElementById("gridCards");
            grid.innerHTML = "";

            let unidades = [];
            if (estado.materia === "Fisica") {
                unidades = bancoDados.Fisica.anos[estado.ano]?.unidades || [];
            } else {
                unidades = bancoDados.Matematica.frentes[estado.frente]?.anos[estado.ano]?.unidades || [];
            }

            unidades.forEach(unidade => {
                const card = document.createElement("div");
                card.className = "unit-card";

                const isEscola = unidade.id.includes("Escola");

                let videosHtml = "";
                if (unidade.videos && unidade.videos.length > 0) {
                    videosHtml = `
                        <div class="videos-section">
                            <details>
                                <summary>▶ Videoaulas Recomendadas (${unidade.videos.length})</summary>
                                <ul class="video-list">
                                    ${unidade.videos.map(v => `
                                        <li class="video-item">
                                            <a href="${v.url}" target="_blank">📺 ${v.titulo}</a>
                                        </li>
                                    `).join('')}
                                </ul>
                            </details>
                        </div>
                    `;
                }

                let btnProfHtml = "";
                if (unidade.pdfProf) {
                    btnProfHtml = `
                        <button class="btn-prof" onclick="acessarGabarito('${unidade.pdfProf}')">
                            🔒 Gabarito
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="unit-badge ${isEscola ? 'adaptado' : ''}">${unidade.id}</span>
                        <h2>${unidade.titulo}</h2>
                    </div>
                    <div class="card-body">
                        <p class="card-desc">${unidade.desc}</p>
                        
                        <div class="card-actions">
                            <a href="${unidade.pdf}" target="_blank" class="btn-pdf">
                                📄 Lista do Aluno
                            </a>
                            ${btnProfHtml}
                        </div>

                        ${videosHtml}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ==========================================
        // MOTOR DE GABARITO TEMPORÁRIO (SECURE LINK)
        // ==========================================
        let urlGabaritoPendente = null;

        function abrirModalChave(url = null) {
            urlGabaritoPendente = url;
            document.getElementById("modalChave").classList.add("open");
            document.getElementById("inputChave").focus();
        }

        function fecharModal() {
            document.getElementById("modalChave").classList.remove("open");
            document.getElementById("inputChave").value = "";
            urlGabaritoPendente = null;
        }

        function confirmarChave() {
            const chave = document.getElementById("inputChave").value.trim();
            if (!chave) return;

            sessionStorage.setItem("prof_secret_key", chave);
            fecharModal();
            atualizarBotaoProf();

            if (urlGabaritoPendente) {
                gerarLinkEAbrir(urlGabaritoPendente, chave);
            }
        }

        function atualizarBotaoProf() {
            const btn = document.getElementById("btnProfToggle");
            if (sessionStorage.getItem("prof_secret_key")) {
                btn.className = "btn-status-prof active";
                btn.innerHTML = "🔓 Professor Ativo";
                btn.onclick = () => {
                    sessionStorage.removeItem("prof_secret_key");
                    atualizarBotaoProf();
                };
            } else {
                btn.className = "btn-status-prof";
                btn.innerHTML = "🔒 Modo Professor";
                btn.onclick = () => abrirModalChave();
            }
        }

        function acessarGabarito(caminhoPdf) {
            const chaveSalva = sessionStorage.getItem("prof_secret_key");
            if (!chaveSalva) {
                abrirModalChave(caminhoPdf);
            } else {
                gerarLinkEAbrir(caminhoPdf, chaveSalva);
            }
        }

        function gerarLinkEAbrir(caminhoRelativo, chaveMestra) {
            // Expiração em 3 minutos (180 segundos)
            const agoraUnix = Math.floor(Date.now() / 1000);
            const expiraEm = agoraUnix + 180;

            const uri = caminhoRelativo.startsWith('/') ? caminhoRelativo : '/' + caminhoRelativo;

            // Formato validado pelo Nginx: "$arg_e$uri Segredo"
            const stringParaAssinar = `${expiraEm}${uri} ${chaveMestra}`;

            // Hash MD5 Base64 URL-Safe (padrão secure_link)
            const hash = CryptoJS.MD5(stringParaAssinar);
            let base64Hash = CryptoJS.enc.Base64.stringify(hash)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');

            const urlFinal = `${uri}?st=${base64Hash}&e=${expiraEm}`;
            window.open(urlFinal, '_blank');
        }

        // Inicia a aplicação
        iniciar();
    </script>
</body>
</html>
